<!DOCTYPE html>
<html>
<head>
    <title>GET Request</title>
</head>

<body>

    <h1>GET Request Example</h1>

    <button onclick="getData()">Send GET Request</button>

    <p id="result"></p>

    <script>
        function getData() {
            fetch("/api/user")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerHTML =
                        "Name: " + data.name + "<br>" +
                        "Email: " + data.email;
                });
        }
    </script>

</body>
</html>
