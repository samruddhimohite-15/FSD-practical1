<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="course">Select Course:</label>
        <select id="course" name="course">
            <option value="bsc.it">Bsc.IT</option>
            <option value="bsc">B.Sc.</option>
            <option value="bcom">B.Com</option>
            <option value="ba">B.A.</option>
        </select>
        <br><br>

        <label>Subjects:</label>
        <input type="checkbox" id="Java" name="subject" value="Java">
        <label for="Java">Java</label>

        <input type="checkbox" id="Cloud" name="subject" value="Cloud">
        <label for="Cloud">Cloud</label>

        <input type="checkbox" id="FSD" name="subject" value="FSD">
        <label for="FSD">FSD</label>
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
